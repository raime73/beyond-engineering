<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador de Ingenierías · Campus Chihuahua</title>
<style>
  :root{
    --tec:#0039A6; --tec-osc:#0B1F4D; --fondo:#F3F5FB; --tarjeta:#FFFFFF;
    --texto:#1B2333; --suave:#5B6478; --borde:#DDE2EE;
    --IMT:#E8611A; --ITC:#7B3FE4; --IBT:#16955F; --IC:#C27C0E; --IIS:#0B8F9B;
    --radio:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--fondo); color:var(--texto); line-height:1.5; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:linear-gradient(120deg,var(--tec-osc),var(--tec));
    color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px;
  }
  .logo-slot{
    width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);
    display:grid;place-items:center;font-weight:800;letter-spacing:.5px;font-size:13px;flex:none;
  }
  .logo-slot img{max-width:100%;max-height:100%}
  header .t1{font-weight:800;font-size:17px;line-height:1.2}
  header .t2{font-size:13px;opacity:.85}
  .back-home{margin-left:auto;flex:none;padding:9px 14px;border:1px solid rgba(255,255,255,.7);border-radius:999px;color:#fff;text-decoration:none;font-size:14px;font-weight:700}
  .back-home:hover,.back-home:focus-visible{background:rgba(255,255,255,.15)}
  .franja{display:flex;height:5px}
  .franja span{flex:1}
  main{max-width:780px;margin:0 auto;padding:28px 16px 60px}
  .card{background:var(--tarjeta);border-radius:var(--radio);padding:28px;box-shadow:0 6px 24px rgba(11,31,77,.08)}
  h1{font-size:28px;line-height:1.2;margin:0 0 14px;color:var(--tec-osc)}
  h2{font-size:22px;line-height:1.25;margin:0 0 10px;color:var(--tec-osc)}
  h3{font-size:16px;margin:18px 0 6px;color:var(--tec-osc)}
  p{margin:0 0 12px}
  .muted{color:var(--suave)}
  .btn{
    appearance:none;border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:700;
    cursor:pointer;background:var(--tec);color:#fff;transition:transform .08s, box-shadow .15s, background .15s;
    font-family:inherit;
  }
  .btn:hover{box-shadow:0 6px 16px rgba(0,57,166,.3)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:#AAB3C7;cursor:not-allowed;box-shadow:none}
  .btn.sec{background:#fff;color:var(--tec);border:2px solid var(--tec)}
  .btn.link{background:none;color:var(--suave);padding:10px 4px;font-weight:600}
  .acciones{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
  .aviso{border-left:6px solid var(--tec);}
  .aviso .icono{font-size:34px;margin-bottom:6px}
  .aviso ul{padding-left:20px;margin:0 0 12px}
  .aviso li{margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .chip{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
  /* Progreso */
  .progreso{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--suave);margin-bottom:8px;font-weight:600}
  .barra{height:8px;border-radius:99px;background:#E3E8F3;overflow:hidden;margin-bottom:22px}
  .barra i{display:block;height:100%;background:linear-gradient(90deg,var(--IMT),var(--ITC),var(--IBT),var(--IC),var(--IIS));transition:width .3s}
  .pregunta{font-size:23px;font-weight:800;line-height:1.3;color:var(--tec-osc);margin:0 0 6px}
  .ayuda{color:var(--suave);margin-bottom:18px;font-size:15px}
  .opciones{display:grid;gap:12px}
  .opcion{
    display:flex;gap:14px;align-items:center;text-align:left;width:100%;
    background:#fff;border:2px solid var(--borde);border-radius:14px;padding:16px 18px;
    font-size:16px;font-family:inherit;color:var(--texto);cursor:pointer;transition:border-color .12s,background .12s,transform .08s;
  }
  .opcion:hover{border-color:#9DB0DA;background:#F7F9FF}
  .opcion:active{transform:scale(.99)}
  .opcion .emo{font-size:26px;flex:none;width:36px;text-align:center}
  .opcion.sel{border-color:var(--tec);background:#EAF0FF;box-shadow:inset 0 0 0 1px var(--tec)}
  .materias{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .escala{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .escala .opcion{flex-direction:column;justify-content:center;text-align:center;padding:16px 8px;gap:8px;font-size:14px;font-weight:600}
  .escala .opcion .emo{width:auto;font-size:28px}
  .contador{font-size:14px;color:var(--suave);margin-top:10px;font-weight:600}
  /* Resultados */
  .top{border-radius:var(--radio);overflow:hidden;background:#fff;box-shadow:0 8px 28px rgba(11,31,77,.12);margin-bottom:22px}
  .top-cab{padding:24px 26px;color:#fff}
  .top-cab .eti{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.9}
  .top-cab .nom{font-size:26px;font-weight:800;line-height:1.2;margin:4px 0}
  .top-cab .lema{font-style:italic;opacity:.95}
  .top-cab .pct{font-size:44px;font-weight:900;line-height:1}
  .top-cab .fila{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .top-cuerpo{padding:22px 26px}
  .porque{background:#F6F8FD;border-radius:12px;padding:14px 18px;margin-bottom:6px}
  .porque ul{margin:6px 0 0;padding-left:20px}
  .porque li{margin-bottom:4px}
  .ficha ul{margin:4px 0 0;padding-left:20px}
  .ficha li{margin-bottom:3px}
  .campus{border-radius:14px;padding:16px 18px;margin:18px 0 4px;border:2px solid;background:#FAFBFE}
  .campus h3{margin:0 0 10px;font-size:17px}
  .campus .cpt{margin:0 0 8px;font-size:15px}
  .campus .cpt:last-child{margin-bottom:0}
  .general{border-top:6px solid var(--tec)}
  .general ul{margin:6px 0 0;padding-left:20px}
  .general li{margin-bottom:8px}
  @media print{.campus{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}}
  .meta{display:inline-block;font-size:13px;font-weight:700;background:#EEF2FA;color:var(--tec-osc);border-radius:99px;padding:5px 12px;margin-top:14px}
  .pie-ficha{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
  .pie-ficha .meta{margin-top:0}
  .btn-onepage{display:inline-flex;align-items:center;gap:6px;border:2px solid;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;text-decoration:none;background:#fff;transition:background .15s}
  .btn-onepage:hover{background:#F4F6FB}
  .seccion{margin:26px 0 12px;font-size:19px;font-weight:800;color:var(--tec-osc)}
  .grafica{display:grid;gap:12px}
  .gfila{display:block}
  .gcab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:5px}
  .gfila .sig{font-weight:800}
  .gfila .sig .muted{font-weight:600}
  .gpista{height:22px;background:#EDF0F7;border-radius:99px;overflow:hidden}
  .gpista i{display:block;height:100%;border-radius:99px;transition:width .8s ease}
  .gfila .val{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
  details.otro{background:#fff;border-radius:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(11,31,77,.06);border-left:6px solid}
  details.otro summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:14px}
  details.otro summary::-webkit-details-marker{display:none}
  details.otro summary .n{font-weight:800;flex:1}
  details.otro summary .p{font-weight:900;font-size:18px}
  details.otro summary .flecha{transition:transform .2s;color:var(--suave)}
  details.otro[open] summary .flecha{transform:rotate(90deg)}
  details.otro .det{padding:0 20px 18px}
  .nota{background:#FFF8E6;border:1px solid #F0D99A;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:15px}
  .solo-impresion{display:none}
  footer{max-width:780px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--suave);text-align:center}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (max-width:560px){
    header{flex-wrap:wrap}
    .back-home{margin-left:56px}
    .card{padding:22px 18px}
    h1{font-size:24px}
    .pregunta{font-size:20px}
    .escala{grid-template-columns:1fr}
    .escala .opcion{flex-direction:row;justify-content:flex-start;text-align:left;font-size:15px}
    .top-cab,.top-cuerpo{padding:20px}
    .top-cab .pct{font-size:36px}
  }
  @media print{
    @page{margin:14mm}
    body{background:#fff}
    header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .no-imprimir,footer{display:none!important}
    .solo-impresion{display:block}
    main{padding:12px 0}
    .top,details.otro,.card{box-shadow:none;border:1px solid #ccd}
    .top-cab,.gpista i,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    details.otro{break-inside:avoid}
    details.otro summary .flecha{display:none}
  }
</style>
</head>

const app = document.getElementById("app");

function nuevoEstado(){
  const orden = {};
  PREGUNTAS.forEach(q => { if(q.opciones) orden[q.id] = barajar(q.opciones.map((_,i)=>i)); });
  return { paso:"aviso", actual:0, resp:{}, orden };
}
function barajar(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  window.scrollTo({top:0});
  if(estado.paso==="aviso") return vistaAviso();
  if(estado.paso==="inicio") return vistaInicio();
  if(estado.paso==="pregunta") return vistaPregunta();
  if(estado.paso==="resultados") return vistaResultados();
}

function vistaPregunta(){
  const q = PREGUNTAS[estado.actual], n = PREGUNTAS.length, r = estado.resp[q.id];
  let cuerpo = "", ayuda = "";
  if(q.tipo==="opcion" || q.tipo==="multi"){
    ayuda = q.tipo==="multi" ? `Selecciona ${q.elegir}.` : "Elige la que más se parezca a ti.";
    cuerpo = `<div class="opciones ${q.tipo==="multi"?"materias":""}">` +
      estado.orden[q.id].map(i => {
        const o = q.opciones[i];
        const sel = q.tipo==="multi" ? (r||[]).includes(i) : r===i;
        return `<button class="opcion ${sel?"sel":""}" data-i="${i}" aria-pressed="${sel}"><span class="emo">${o.emo}</span><span>${esc(o.texto)}</span></button>`;
      }).join("") + `</div>` +
      (q.tipo==="multi" ? `<div class="contador" id="cont">${(r||[]).length} de ${q.elegir} seleccionadas</div>` : "");
  } else {
    ayuda = "¿Qué tanto se parece a ti?";
    cuerpo = `<div class="escala">` + ESCALA.map((e,i)=>
      `<button class="opcion ${r===i?"sel":""}" data-i="${i}" aria-pressed="${r===i}"><span class="emo">${e.emo}</span><span>${e.texto}</span></button>`).join("") + `</div>`;
  }
  const listo = q.tipo==="multi" ? (r||[]).length===q.elegir : r!==undefined;
  app.innerHTML = `
  <div class="card fade">
    <div class="progreso"><span>Pregunta ${estado.actual+1} de ${n}</span><span>${Math.round(estado.actual/n*100)}%</span></div>
    <div class="barra"><i style="width:${estado.actual/n*100}%"></i></div>
    <p class="pregunta">${esc(q.texto)}</p>
    <div class="ayuda">${ayuda}</div>
    ${cuerpo}
    <div class="acciones">
      <button class="btn link" id="atras">← Anterior</button>
      <span style="flex:1"></span>
      <button class="btn" id="sig" ${listo?"":"disabled"}>${estado.actual===n-1?"Ver mis resultados":"Siguiente →"}</button>
    </div>
  </div>`;

  app.querySelectorAll(".opcion").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(q.tipo==="multi"){
      let arr = [...(estado.resp[q.id]||[])];
      if(arr.includes(i)) arr = arr.filter(x=>x!==i);
      else { if(arr.length>=q.elegir) arr.shift(); arr.push(i); }
      estado.resp[q.id] = arr; vistaPregunta();
    } else {
      estado.resp[q.id] = i;
      app.querySelectorAll(".opcion").forEach(x=>{x.classList.toggle("sel", x===b); x.setAttribute("aria-pressed", x===b);});
      document.getElementById("sig").disabled = false;
      const idx = estado.actual;
      setTimeout(() => { if(estado.paso==="pregunta" && estado.actual===idx) avanzar(); }, 280);
    }
  });
  document.getElementById("sig").onclick = avanzar;
  document.getElementById("atras").onclick = () => {
    if(estado.actual===0){ estado.paso="inicio"; } else estado.actual--;
    render();
  };
}

let avanzando = false;
function avanzar(){
  if(avanzando) return; avanzando = true;
  setTimeout(()=>avanzando=false, 350);
  if(estado.paso!=="pregunta") return;
  if(estado.actual < PREGUNTAS.length-1){ estado.actual++; } else { estado.paso="resultados"; }
  render();
}

/* Cálculo: puntaje de cada programa / puntaje máximo alcanzable para ese programa */
function calcular(){
  const res = {}; SIGLAS.forEach(s => res[s] = {pts:0, max:0, razones:[]});
  PREGUNTAS.forEach(q => {
    const r = estado.resp[q.id];
    SIGLAS.forEach(s => {
      if(q.tipo==="escala"){ res[s].max += 4*(q.pts[s]||0); }
      else {
        const vals = q.opciones.map(o=>o.pts[s]||0).sort((a,b)=>b-a);
        const k = q.tipo==="multi" ? q.elegir : 1;
        res[s].max += vals.slice(0,k).reduce((a,b)=>a+b,0);
      }
    });
    if(r===undefined) return;
    if(q.tipo==="escala"){
      Object.entries(q.pts).forEach(([s,w]) => {
        res[s].pts += r*w;
        if(r>=3) res[s].razones.push({p:r*w, t:`Te identificas con: «${q.texto}»`});
      });
    } else {
      (q.tipo==="multi" ? r : [r]).forEach(i => {
        const o = q.opciones[i];
        Object.entries(o.pts).forEach(([s,w]) => {
          res[s].pts += w;
          res[s].razones.push({p:w, t:`${q.razon} <strong>${esc(o.corto)}</strong>.`});
        });
      });
    }
  });
  return SIGLAS.map(s => ({s, pct: res[s].max ? Math.round(res[s].pts/res[s].max*100) : 0, pts:res[s].pts,
      razones: res[s].razones.sort((a,b)=>b.p-a.p).slice(0,4).map(x=>x.t)}))
    .sort((a,b)=> b.pct-a.pct || b.pts-a.pts);
}

    <h3>Afinidades</h3>${lista(p.afinidades)}
    <h3>Qué aprenderás</h3>${lista(p.aprenderas)}
    <h3>Áreas de especialidad (ejemplos)</h3>${lista(p.areas)}
    <h3>Dónde trabajan los egresados</h3>${lista(p.trabajo)}
    ${p.chihuahua && p.chihuahua.length ? `<div class="campus" style="border-color:${p.color};background:color-mix(in srgb, ${p.color} 7%, white)">
      <h3 style="color:${p.color}">📍 Estudiar ${esc(p.nombre)} en Campus Chihuahua</h3>

}

    <div class="seccion">¿Por qué Campus Chihuahua?</div>
    <div class="card general">
      <ul>${POR_QUE_CHIHUAHUA.map(x=>`<li><strong>${esc(x.t)}:</strong> ${esc(x.d)}</li>`).join("")}</ul>
    </div>

    <div class="seccion">Conoce los demás programas</div>
    ${rk.slice(1).map(r=>{ const p=PROGRAMAS[r.s]; return `
      <details class="otro" style="border-left-color:${p.color}">
        <summary><span class="chip" style="background:${p.color}">${r.s}</span><span class="n">${esc(p.nombre)}</span><span class="p" style="color:${p.color}">${r.pct}%</span><span class="flecha">▶</span></summary>
        <div class="det"><p class="lema" style="font-style:italic">“${esc(p.lema)}”</p>${porque(r)}${ficha(r.s)}</div>
      </details>`;}).join("")}

    <div class="solo-impresion nota" style="margin-top:18px">
      <strong>Aviso:</strong> Esta herramienta no es un test vocacional ni una prueba psicométrica regulada y no sustituye la orientación de un profesional. Es una herramienta informativa para conocer los programas de la Escuela de Ingeniería y Ciencias del Tec de Monterrey, Campus Chihuahua.
    </div>

    <div class="acciones no-imprimir">
      <button class="btn" id="imp">🖨️ Imprimir / guardar PDF</button>
      <button class="btn sec" id="nuevo">Nuevo candidato</button>
      <button class="btn link" id="rev">← Revisar respuestas</button>
    </div>
  </div>`;
  requestAnimationFrame(()=>setTimeout(()=>app.querySelectorAll(".gpista i").forEach(i=>i.style.width=i.dataset.w+"%"),60));
  document.getElementById("imp").onclick = () => window.print();
  document.getElementById("nuevo").onclick = () => {
    if(confirm("¿Borrar estas respuestas y empezar con un nuevo candidato?")){ estado = nuevoEstado(); render(); }
  };
  document.getElementById("rev").onclick = () => { estado.paso="pregunta"; estado.actual=PREGUNTAS.length-1; render(); };
}

/* Al imprimir: abrir todas las fichas y mostrar las barras completas */
window.addEventListener("beforeprint", () => {
  document.querySelectorAll("details.otro").forEach(d=>{ d.dataset.prev = d.open; d.open = true; });
  document.querySelectorAll(".gpista i").forEach(i=>i.style.width=i.dataset.w+"%");
});
window.addEventListener("afterprint", () => {
  document.querySelectorAll("details.otro").forEach(d=>{ d.open = d.dataset.prev==="true"; });
});

estado = nuevoEstado();
render();
</script>
</body>
</html>
