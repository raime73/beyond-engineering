<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F4D">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Misión Despegue: prepara un cohete con 5 ingenierías en retos rápidos y descubre en cuáles te ves. Escuela de Ingeniería y Ciencias, Tec de Monterrey Campus Chihuahua.">
<title>Misión Despegue · 5 ingenierías, 1 cohete · EIC Tec Chihuahua</title>
<style>
/* =========================================================
   ESTILOS
   ========================================================= */
:root{
  --tec:#0039A6; --tec-dark:#0B1F4D; --bg:#0A1638; --bg2:#0F2152;
  --panel:#13275C; --line:rgba(255,255,255,.16);
  --text:#FFFFFF; --muted:#C3CDE6; --spark:#FFD84D; --bad:#FF6B6B; --good:#5CF2A6;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050C22;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,#12307a 0%,#050C22 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--spark);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;width:100%;max-width:min(860px,72vh);max-width:min(860px,72dvh);height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 55%,#071029 100%);overflow:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.6)}

/* ---------- Barra superior ---------- */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:.5em;padding:.55em .8em;
  padding-top:max(.55em,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(5,12,34,.55)}
.brand{font-weight:900;letter-spacing:.12em;font-size:.95em;display:flex;align-items:center;gap:.35em;margin-right:auto}
.brand .bolt{color:var(--spark)}
.progress-pill{font-weight:800;font-size:.8em;padding:.35em .7em;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);white-space:nowrap}
.tb-btn{display:inline-flex;align-items:center;gap:.35em;min-height:44px;padding:.4em .75em;border-radius:99px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:.8em;font-weight:700;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-btn.warn{background:var(--spark);color:#111;border-color:var(--spark)}
.tb-btn .ico{font-size:1.15em;line-height:1}
#app.narrow #soundBtn .lbl{display:none}
#app.narrow .tb-btn{padding:.4em .6em}
#app.narrow .brand{letter-spacing:.06em}

main{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1 1 auto;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:1em 1.1em calc(1em + env(safe-area-inset-bottom));animation:enter .35s ease both}
.screen>*{flex-shrink:0}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:.45em;width:100%;min-height:56px;padding:.8em 1.2em;
  border:0;border-radius:16px;font-weight:900;font-size:1.1em;letter-spacing:.02em;text-decoration:none;
  transition:transform .12s ease, filter .12s ease}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--spark);color:#111;box-shadow:0 6px 0 #B88F00,0 10px 30px rgba(255,216,77,.35)}
.btn-main:active{box-shadow:0 2px 0 #B88F00;transform:translateY(4px)}
.btn-ghost{background:rgba(255,255,255,.08);border:2px solid var(--line);color:#fff;font-size:1em}
.btn-tec{background:#fff;color:var(--tec-dark)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}

/* ---------- Inicio ---------- */
.home{justify-content:space-between;gap:1em;text-align:center}
.home-city{position:relative}
.home-city svg{border-radius:14px;max-height:13em;width:auto;margin:0 auto}
.home-city svg{display:block;width:100%;height:auto}
.title{margin:.25em 0 0;font-size:3.2em;line-height:.9;font-weight:900;letter-spacing:.06em;
  text-shadow:0 0 18px rgba(255,216,77,.55),0 4px 0 #000}
.title .flick{animation:flick 4s infinite}
@keyframes flick{0%,6%,9%,40%,43%,100%{opacity:1}7%,41%{opacity:.25}}
.subtitle{margin:.2em 0 0;font-size:1.25em;font-weight:800;color:var(--spark);letter-spacing:.04em}
.story{margin:.45em auto 0;max-width:30em;color:var(--muted);font-size:1em;line-height:1.45}
.rules{display:flex;justify-content:center;gap:.45em;flex-wrap:wrap;margin:.8em 0 0;padding:0;list-style:none}
.rules li{font-size:.8em;font-weight:800;padding:.45em .75em;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.teus{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.home{gap:.6em}
.home-hero{display:flex;flex-direction:column;align-items:center;gap:.3em;margin-top:.3em}
.teus-hero{height:12.5em;width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.bubble{position:relative;margin:0;padding:.55em .8em;border-radius:16px;background:#fff;color:#0B1F4D;font-weight:700;line-height:1.35;font-size:.92em;text-align:left}
.bubble b{color:#0039A6}
.bubble.big{font-size:1em;text-align:center;max-width:24em}
.bubble.big::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.teus-row{display:flex;align-items:center;gap:.5em}
.teus-row .teus-sm{width:3.6em;height:auto;flex:0 0 auto}
.teus-row .bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right-color:#fff}
.map-teus{margin:.5em 0 0}
.brief-teus{margin:0 0 .4em}
.brief-teus .bubble{font-size:.88em}
.teus-fly{position:absolute;width:5em;height:auto;left:4%;bottom:6%;opacity:0;transition:opacity .3s}
.city-wrap.launching .teus-fly{opacity:1;animation:teusfly 2.6s cubic-bezier(.5,0,.85,.55) forwards}
@keyframes teusfly{0%{transform:translate(0,0) rotate(-10deg)}100%{transform:translate(140%,-160vh) rotate(10deg)}}
.cheer{display:flex;align-items:center;justify-content:center;gap:.6em}
.cheer .teus-cheer{width:4.6em;height:auto;animation:jump .7s ease both}
@keyframes jump{0%{transform:translateY(30px) scale(.6);opacity:0}60%{transform:translateY(-8px) scale(1.05);opacity:1}100%{transform:none}}
.cheer .done-tag{text-align:left;font-size:1.15em;line-height:1.2;text-transform:none;letter-spacing:0}
.cheer .done-tag span{font-size:.75em;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.foot{font-size:.72em;color:var(--muted);line-height:1.4;margin:.9em 0 0}

/* ---------- Mapa ---------- */
.map-head{text-align:center}
.map-head h1{margin:.1em 0 .1em;font-size:1.6em;font-weight:900;line-height:1.1}
.map-head p{margin:0;color:var(--muted)}
.city-wrap{flex:1 1 auto;display:flex;align-items:center;margin:.5em -1.1em}
.city-wrap svg{width:100%;height:auto;display:block;max-height:60vh}
.zone{cursor:pointer}
.zone .halo{opacity:0}
.zone.off .halo{animation:halo 1.8s ease-in-out infinite}
@keyframes halo{50%{opacity:.55}}
.zone.done{cursor:default}
.zone.just-lit .bld{animation:lightup 1.2s ease both}
@keyframes lightup{0%{filter:brightness(.3)}35%{filter:brightness(2.2)}100%{filter:none}}
.zone:focus-visible{outline:none}
.zone:focus-visible .zone-label rect{stroke:var(--spark);stroke-width:3}
.meter{display:flex;align-items:center;gap:.6em;margin:0 0 .8em}
.meter-bar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid var(--line)}
.meter-bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD84D,#FFF3B0);border-radius:99px;transition:width .8s ease}
.meter b{font-size:.9em;white-space:nowrap}

/* ---------- Juego ---------- */
.game{padding:0}
.hud{padding:.6em 1em .5em;background:rgba(5,12,34,.6)}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:.6em}
.zone-tag{font-weight:900;font-size:.85em;padding:.3em .7em;border-radius:99px;background:rgba(255,255,255,.1)}
.counts{font-weight:900;font-size:1em;display:flex;gap:.8em}
.counts .ok{color:var(--good)} .counts .ko{color:var(--bad)}
.timer{height:10px;margin:.5em 0 .35em;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--spark);transform-origin:left;border-radius:99px}
.timer.hurry i{background:var(--bad)}
.timer.warm i{background:var(--good)}
.instr{margin:0;text-align:center;font-weight:900;font-size:1.15em;letter-spacing:.02em}
.stage{position:relative;flex:1 1 auto;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:1.2em;pointer-events:none;background:rgba(5,12,34,.72)}
.overlay.hide{display:none}
.ov-zone{font-weight:800;color:var(--muted);font-size:.95em;margin:0 0 .2em;letter-spacing:.08em;text-transform:uppercase}
.ov-big{font-size:2.1em;font-weight:900;line-height:1.05;margin:0 0 .35em}
.ov-help{font-size:1.05em;color:#fff;margin:0 0 .7em;background:rgba(255,255,255,.1);padding:.45em .9em;border-radius:99px}
.ov-count{font-size:4.5em;font-weight:900;color:var(--spark);line-height:1;animation:pop .6s ease both}
@keyframes pop{0%{transform:scale(1.8);opacity:0}40%{transform:scale(1);opacity:1}}
.controls{display:flex;gap:.6em;padding:.6em 1em calc(.7em + env(safe-area-inset-bottom));background:rgba(5,12,34,.6)}
.controls:empty{display:none}
.ctl{flex:1;min-height:68px;border-radius:16px;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);
  font-weight:900;font-size:1.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;touch-action:manipulation}
.ctl .big{font-size:1.5em;line-height:1}
.ctl:active,.ctl.hit{transform:scale(.96);background:rgba(255,255,255,.25)}

/* ---------- Calificar / revelar ---------- */
.rate{justify-content:safe center;gap:.7em;text-align:center}
.rate .done-tag{font-weight:900;color:var(--spark);font-size:1em;letter-spacing:.06em;text-transform:uppercase;margin:0}
.rate h1{margin:0;font-size:1.7em;line-height:1.1;font-weight:900}
.energy-big{font-size:1em;color:var(--muted);margin:0}
.energy-big b{color:#fff;font-size:1.3em}
.rate-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.45em}
.rate-btn{display:flex;flex-direction:column;justify-content:center;text-align:center!important;gap:.15em;min-height:64px;font-size:.95em!important;padding:.6em 1em;border-radius:16px;border:2px solid var(--line);
  background:rgba(255,255,255,.07);font-weight:900;font-size:1.1em;text-align:left}
.rate-btn .fl{font-size:1.05em;letter-spacing:-.1em}
.rate-btn:hover{background:rgba(255,255,255,.14)}
.rate-btn:active{transform:scale(.98)}
.reveal{display:flex;flex-direction:column;gap:.8em;animation:flip .5s ease both}
@keyframes flip{from{transform:rotateX(70deg);opacity:0}to{transform:none;opacity:1}}
.reveal-card{border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;text-align:left}
.reveal-band{display:flex;align-items:center;gap:.7em;padding:.8em 1em}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:3.2em;padding:.25em .5em;border-radius:12px;
  font-weight:900;font-size:1.25em;letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.reveal-band h2{margin:0;font-size:1.15em;line-height:1.15}
.reveal-body{padding:0 1em 1em}
.reveal-body p{margin:.2em 0 .7em;line-height:1.45;color:#E6ECFA}
.chips{display:flex;flex-wrap:wrap;gap:.35em;margin:0;padding:0;list-style:none}
.chips li{font-size:.8em;font-weight:700;padding:.35em .65em;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid var(--line)}

/* ---------- Ficha de misión ---------- */
.brief-screen{gap:.6em;justify-content:safe center}
.brief{border-radius:22px;overflow:hidden;background:var(--panel);border:2px solid var(--cl);box-shadow:0 0 40px color-mix(in srgb,var(--c) 35%,transparent)}
.brief-band{display:flex;align-items:center;gap:.7em;padding:.9em 1em;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,#0B1F4D),color-mix(in srgb,var(--c) 40%,#0B1F4D))}
.brief-ico{font-size:2.6em;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.brief-kick{margin:0;font-weight:900;font-size:.8em;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.brief-band h1{margin:.15em 0 0;font-size:1.15em;line-height:1.1;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.brief-band .badge{background:rgba(0,0,0,.35);font-size:.85em;min-width:0;vertical-align:middle}
.brief-body{padding:.8em 1em .9em}
.brief-lbl{margin:.6em 0 .25em;font-size:.75em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--cl)}
.brief-lbl:first-child{margin-top:0}
.brief-mision{margin:0;font-size:1em;line-height:1.35;font-weight:700}
.brief-goal{margin:.7em 0 0;padding:.55em .75em;border-radius:12px;background:color-mix(in srgb,var(--c) 22%,transparent);border-left:5px solid var(--cl)}
.brief-goal .brief-lbl{margin:0 0 .15em;color:var(--spark)}
.brief-goal p:last-child{margin:0;font-weight:700;line-height:1.35}
.how-inline{text-transform:none;letter-spacing:0;color:#fff;font-size:1.25em}
.legend{margin:0;padding:0;list-style:none;display:grid;gap:.25em}
.legend li{font-size:.84em;padding:.3em .6em;border-radius:10px;background:rgba(255,255,255,.07);line-height:1.3}
.launch-count{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:5em;font-weight:900;color:var(--spark);
  text-shadow:0 4px 0 #000,0 0 30px rgba(255,216,77,.6);pointer-events:none}
.launch-count.pop{animation:pop .6s ease both}
.city-wrap{position:relative;justify-content:center}
.rocket-svg .flame{opacity:0}
.rocket-svg.launch .zone-label,.rocket-svg.launch line,.rocket-svg.launch .halo{opacity:0;transition:opacity .4s}
.rocket-svg .smoke{opacity:0}
.rocket-svg.launch .flame{opacity:1;animation:flick2 .12s infinite alternate}
.rocket-svg.launch .rocket-body{animation:liftoff 2.4s cubic-bezier(.5,0,.85,.55) forwards}
.rocket-svg.launch .smoke{opacity:.75;animation:smoke 2.4s ease-out forwards;transform-origin:180px 360px}
@keyframes liftoff{0%{transform:translateY(0)}6%{transform:translate(-2px,2px)}10%{transform:translate(2px,0)}14%{transform:translate(-1px,1px)}100%{transform:translateY(-600px)}}
@keyframes flick2{from{transform:scaleY(1);transform-origin:180px 340px}to{transform:scaleY(1.25);transform-origin:180px 340px}}
@keyframes smoke{from{transform:scale(.6)}to{transform:scale(2.4);opacity:0}}
.tools li{background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--cl);font-size:.88em}
.brief-how{margin:0;display:flex;flex-direction:column;gap:.25em;padding:.6em .8em;border-radius:12px;background:rgba(255,255,255,.07)}
.brief-how b{font-size:1.05em}
.brief-how span{color:var(--muted);font-size:.92em}
.badge.sm{font-size:.8em;min-width:0;padding:.15em .45em;border-radius:8px;margin-right:.2em}
.zone-tag{display:inline-flex;align-items:center}
.coach{margin-top:.15em}
.coach .coach-img{width:2.7em;height:auto;flex:0 0 auto}
.coach .bubble{flex:1;font-size:.92em;font-weight:900;padding:.45em .7em;min-height:2.3em;line-height:1.3;transition:background .2s}
.coach .bubble b{margin-right:.3em}
.bubble.bad{background:#FFE1E1;color:#8A0016}
.bubble.bad::before{border-right-color:#FFE1E1!important}
.bubble.concept{background:#FFF3B0}
.bubble.concept::before{border-right-color:#FFF3B0!important}
.ov-teus{width:5.5em;height:auto;margin-bottom:.3em;animation:float 3s ease-in-out infinite}
.concept-pop{position:absolute;z-index:3;left:50%;top:4em;transform:translate(-50%,-30px);opacity:0;pointer-events:none;white-space:nowrap;
  padding:.45em .9em;border-radius:99px;font-weight:900;font-size:.95em;background:#fff;color:#0B1F4D;border:3px solid var(--c);
  box-shadow:0 6px 20px rgba(0,0,0,.4)}
.concept-pop.show{animation:cpop 1.6s ease both}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}

/* ---------- Carta de habilidad ---------- */
.card-flip{perspective:900px}
.skill{border-radius:20px;padding:.9em 1em 1em;text-align:left;background:
  linear-gradient(160deg,color-mix(in srgb,var(--c) 45%,#0B1F4D) 0%,#0F2152 60%);border:3px solid var(--cl);
  box-shadow:0 0 0 4px rgba(255,255,255,.06),0 12px 34px color-mix(in srgb,var(--c) 40%,transparent);animation:flip .6s ease both}
.skill-top{display:flex;justify-content:space-between;align-items:center}
.skill .badge{background:var(--c)}
.skill-ico{font-size:2em}
.skill-kick{margin:.4em 0 0;font-size:.72em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--spark)}
.skill h2{margin:.05em 0 .1em;font-size:1.45em;line-height:1.08;font-weight:900}
.skill-car{margin:0;font-weight:700;color:var(--cl);font-size:.9em}
.skill-lbl{margin:.65em 0 .2em;font-size:.72em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--cl)}
.skill-txt{margin:0;line-height:1.4;font-size:.95em;color:#EEF2FC}
.after-actions{display:grid;gap:.5em;margin-top:.2em}
.pick{gap:.6em}
.pick-title{margin:.2em 0 0;font-size:1.5em;font-weight:900;text-align:center}
.pick-sub{margin:0;text-align:center;color:var(--muted)}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.pick-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.2em;text-align:left;padding:.7em;border-radius:16px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 35%,#0B1F4D),#0F2152);border:3px solid rgba(255,255,255,.18);min-height:7.2em}
.pick-card:last-child{grid-column:1 / -1}
.pick-card b{font-size:.95em;line-height:1.15}
.pick-card small{color:var(--cl);font-weight:700;font-size:.75em}
.pick-ico{position:absolute;right:.5em;top:.5em;font-size:1.5em}
.pick-star{position:absolute;right:.4em;bottom:.35em;font-size:1.3em;opacity:0;transform:scale(.4);transition:.2s}
.pick-card[aria-pressed="true"]{border-color:var(--spark);box-shadow:0 0 0 3px rgba(255,216,77,.35),0 8px 24px color-mix(in srgb,var(--c) 40%,transparent);transform:translateY(-2px)}
.pick-card[aria-pressed="true"] .pick-star{opacity:1;transform:none}
.btn:disabled{opacity:.55;box-shadow:none}
.rate-q{font-size:1.2em!important;margin-top:.1em!important}
.kicker.small{font-size:.75em;margin-top:.7em}
.scores em{display:block;font-style:normal;font-size:.56em;line-height:1.15;margin:.2em .15em 0;color:#E6ECFA;min-height:2.3em}

/* ---------- Resultado ---------- */
.result{gap:.8em;padding-top:.8em}
.card{position:relative;border-radius:22px;padding:1em;background:
  radial-gradient(ellipse at 50% 0%,rgba(255,216,77,.18),transparent 60%),linear-gradient(180deg,#14306F,#0B1F4D);
  border:2px solid rgba(255,255,255,.22);box-shadow:0 14px 40px rgba(0,0,0,.45);overflow:hidden}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:.72em;font-weight:800;color:var(--muted);letter-spacing:.06em}
.card-top .brand{font-size:1.25em;color:#fff;margin:0}
.card-hero{display:flex;align-items:center;gap:.8em;margin:.45em 0 .1em}
.card-hero .av{width:3.8em;flex:0 0 auto}
.card-hero .av img{width:100%;height:auto}
.card-hero h1{margin:0;font-size:1.3em;line-height:1.05;font-weight:900}
.card-hero p{margin:.15em 0 0;color:var(--muted);font-size:.9em}
.card-city svg{display:block;width:auto;height:8.5em;margin:.3em auto .1em;border-radius:12px}
.kicker{margin:.3em 0 .4em;font-weight:900;font-size:.85em;letter-spacing:.1em;text-transform:uppercase;color:var(--spark)}
.winners{display:grid;gap:.5em}
.winners.n2{grid-template-columns:1fr 1fr}
.win{border-radius:16px;background:rgba(5,12,34,.55);border:1px solid var(--line);border-top:8px solid var(--c);padding:.7em .8em}
.win .badge{font-size:1.5em;background:var(--c)}
.win h2{margin:.35em 0 .2em;font-size:1.15em;line-height:1.15}
.win p{margin:0;font-size:.85em;color:#E6ECFA;line-height:1.35}
.win .chips{margin-top:.5em}
.chips.emp li{background:#fff;color:#0B1F4D;border-color:#fff}
.empresas.in-win .skill-lbl{color:var(--spark);margin-top:.5em;font-size:.6em;letter-spacing:.04em}
.empresas.in-win .chips li{font-size:.68em}
.win .chips li{font-size:.72em}
.winners.n2 .badge{font-size:1.25em}
.winners.n2 h2{font-size:.95em}
.winners.many{grid-template-columns:repeat(auto-fit,minmax(5.5em,1fr))}
.winners.many .win{text-align:center;padding:.55em .4em}
.winners.many .badge{font-size:1.15em}
.winners.many h2{font-size:.72em;margin:.35em 0 0}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:.3em;margin:.8em 0 0;padding:0;list-style:none}
.scores li{text-align:center;border-radius:12px;background:rgba(255,255,255,.06);padding:.4em .1em;border-bottom:4px solid var(--c)}
.scores b{display:block;font-size:.8em;letter-spacing:.04em}
.scores span{display:block;font-size:.72em;margin-top:.15em;letter-spacing:-.1em}
.next{margin:.8em 0 0;padding:.7em .8em;border-radius:14px;background:#DCE8FF;color:var(--tec-dark)}
.next{display:flex;align-items:center;flex-wrap:wrap;gap:.6em}
.next-teus{display:flex;flex:0 0 auto}
.next-teus img{width:3.3em;height:auto;display:block}
.next-teus img+img{margin-left:-1.25em}
.next b{display:block;font-size:.95em}
.next span{display:block;font-size:.82em;margin-top:.15em;line-height:1.35}
.disclaimer{margin:.6em 0 0;font-size:.72em;color:var(--muted);text-align:center;line-height:1.35}
.snap-hint{text-align:center;font-weight:800;font-size:.85em;color:var(--spark);margin:0}
.actions{display:grid;gap:.55em}
.actions .row{display:grid;grid-template-columns:1fr 1fr;gap:.55em}

/* ---------- Mensajes flotantes ---------- */
.toast{position:absolute;left:50%;bottom:1.2em;transform:translate(-50%,150%);background:#fff;color:#111;font-weight:800;
  padding:.6em 1em;border-radius:99px;transition:transform .25s ease;z-index:20;font-size:.9em;pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (min-width:700px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
</style>

/* ---------- Sonido (sintetizado, sin archivos) ---------- */
const Snd = {
  on: CFG.sonidoInicial, ctx: null,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
           if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d = .12, type = 'sine', v = .12, f2 = null, delay = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
  tap()  { this.tone(660, .06, 'triangle', .08); },
  good() { this.tone(880, .09, 'square', .06); this.tone(1320, .12, 'square', .05, null, .06); },
  bad()  { this.tone(200, .22, 'sawtooth', .09, 90); },
  tick() { this.tone(520, .05, 'sine', .07); },
  count(){ this.tone(440, .12, 'square', .07); },
  go()   { this.tone(880, .25, 'square', .08, 1320); },
  end()  { this.tone(700, .3, 'triangle', .1, 300); },
  light(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .18, 'triangle', .09, null, i * .09)); },
  whoosh(){ this.tone(140, 2.2, 'sawtooth', .12, 35); this.tone(70, 2.4, 'square', .05, 30); },
  win()  { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .25, 'square', .06, null, i * .11)); }
};

function mix(hex, to, t) {
  const a = hex.match(/\w\w/g).map(h => parseInt(h, 16)), b = to.match(/\w\w/g).map(h => parseInt(h, 16));
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

  </section>`;

function startGame(game) {
  const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
  const dur = CFG.duracionReto;
  G = { game, cv, ctx, stage, raf: 0, phase: 'count', t: 0, countT: 2.4, last: performance.now(), pressed: false, w: 0, h: 0, shake: 0, fx: makeFX(), nextConcept: 3, conceptI: 0, lastE: 0, lastBad: -9 };
  game.fx = G.fx; game.G = G;
  function size() {
    const r = stage.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    G.w = r.width; G.h = r.height; cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game.ready) game.resize(G.w, G.h); else { game.init(G.w, G.h); game.ready = true; }
  }
  size(); G.size = size; addEventListener('resize', size);
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { if (G.phase !== 'play') return; G.pressed = true; cv.setPointerCapture?.(e.pointerId); const [x, y] = pos(e); game.down && game.down(x, y); };
  cv.onpointermove = e => { if (G.phase !== 'play') return; const [x, y] = pos(e); game.move && game.move(x, y, G.pressed || e.pointerType === 'mouse'); };
  cv.onpointerup = cv.onpointercancel = e => { G.pressed = false; if (G.phase !== 'play') return; const [x, y] = pos(e); game.up && game.up(x, y); };
  document.querySelectorAll('[data-ctl]').forEach(b => {
    b.onpointerdown = e => { e.preventDefault(); if (G.phase === 'play') game.controls[+b.dataset.ctl].action(); b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); };
    b.onclick = e => { if (e.detail === 0 && G.phase === 'play') game.controls[+b.dataset.ctl].action(); }; // teclado
  });
  G.keydown = e => { if (G.phase === 'play' && game.key) { if (game.key(e.key, true) !== false && [' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault(); } };
  G.keyup = e => { if (G.phase === 'play' && game.key) game.key(e.key, false); };
  addEventListener('keydown', G.keydown); addEventListener('keyup', G.keyup);
  let lastCount = 4;
  Snd.count();
  function frame(now) {
    const dt = Math.min(.05, (now - G.last) / 1000); G.last = now;
    if (G.phase === 'count') {
      G.countT -= dt;
      const n = Math.ceil(G.countT / .8);
      if (n !== lastCount && n > 0) { lastCount = n; const c = $('#ovCount'); if (c) { c.textContent = n; c.style.animation = 'none'; c.offsetHeight; c.style.animation = ''; } if (n < 3) Snd.count(); }
      if (G.countT <= 0) { G.phase = 'play'; $('#ov').classList.add('hide'); Snd.go(); coachSay(`${T.calentamiento} ${R[S.current].ayuda}`, 'concept', (CFG.calentamiento || 2) + .5); }
    } else if (G.phase === 'play') {
      G.t += dt; game.update(dt, G.t * 20 / dur);   // la dificultad se escala: 20 s de diseño repartidos en la duración configurada
      if (G.t < (CFG.calentamiento || 0)) game.stats.e = 0;
      $('#timer').classList.toggle('warm', G.t < (CFG.calentamiento || 0));
      if (game.stats.a >= G.nextConcept) { G.nextConcept += 9; showConcept(game.career, G.conceptI++); G.lastBad = G.t; }
      if (game.stats.e > G.lastE) { G.lastE = game.stats.e; if (G.t - G.lastBad > 1.8) { G.lastBad = G.t; coachSay(TE.cuidado[Math.floor(Math.random() * TE.cuidado.length)], 'bad', 1.3); } }
      const left = Math.max(0, 1 - G.t / dur);
      $('#timerBar').style.transform = `scaleX(${left})`;
      $('#timer').classList.toggle('hurry', left < .2);
      if (G.t >= dur) endGame();
    }
    G.fx.update(dt);
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
    ctx.save();
    if (G.shake && !reduceMotion) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
    game.draw(ctx, G.w, G.h); G.fx.draw(ctx);
    ctx.restore();
    $('#okN').textContent = game.stats.a; $('#koN').textContent = game.stats.e;
    if (G.phase !== 'off') G.raf = requestAnimationFrame(frame);
  }
  G.raf = requestAnimationFrame(frame);
}
let coachT = 0;
function coachSay(text, kind = '', dur = 1.6) {
  const el = $('#coachTxt'); if (!el) return;
  el.innerHTML = `<b>${esc(TE.nombre)}:</b> ${esc(text)}`; el.className = 'bubble ' + kind;

}
function showConcept(k, i) {
  const list = R[k].conceptos; if (!list.length) return;
  coachSay(list[i % list.length], 'concept', 2.2);
  Snd.tone(988, .08, 'triangle', .07); Snd.tone(1480, .12, 'triangle', .06, null, .07);
}
function stopGame() {
  if (!G) return;
  G.phase = 'off'; cancelAnimationFrame(G.raf);
  removeEventListener('resize', G.size); removeEventListener('keydown', G.keydown); removeEventListener('keyup', G.keyup);
  G = null;
}
function hurt(power = 7) { if (G) G.shake = power; Snd.bad(); buzz(60); }
function energyOf(st) {
  const tot = st.a + st.e;
  if (tot < 3) return 30;
  return Math.round(clamp(100 * st.a / (st.a + st.e * 1.3), 10, 100));
}
function endGame() {
  const k = S.current, st = G.game.stats;
  G.phase = 'ending';
  Snd.end(); buzz(120);
  const ov = $('#ov'); ov.classList.remove('hide');
  ov.innerHTML = `${teusImg('ov-teus')}<p class="ov-big" style="font-size:3em;color:var(--spark)">${esc(T.tiempo)}</p>`;
  const energia = energyOf(st);
  setTimeout(() => { stopGame(); screenRate(k, energia); }, 900);
}

let idleT = 0;
function stopIdle() { clearTimeout(idleT); idleT = 0; document.removeEventListener('pointerdown', armIdle, true); }
function armIdle() { clearTimeout(idleT); idleT = setTimeout(() => newPlayer(), CFG.reinicioAutomatico * 1000); }
function screenResult() {
  setProgress();
  const top = computeResult();
  const avg = Math.round(ORDER.reduce((s, k) => s + S.results[k].energia, 0) / 5);
  const kicker = top.length === 1 ? T.kicker1 : top.length === 2 ? T.kicker2 : top.length === 5 ? T.kickerTodas : T.kickerVarias;

  }).join('');

          for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283, rr = i % 2 ? o.r * .6 : o.r * 1.1; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }

          label(ctx, '👾', o.x, o.y + 1, 16); label(ctx, J.etiquetaMalware, o.x, o.y + 30, 11, '#FFB3C1', 'center', 800);
        } else {
          ctx.font = '800 12px system-ui,sans-serif';
          const bw = Math.min(this.pa() - 20, 176), lines = wrapText(ctx, '“' + o.text + '”', bw - 16), bh = 22 + lines.length * 15;
          const bx = clamp(o.x - bw / 2, 6, this.pa() - bw - 4), by = o.y - bh / 2;
          rrect(ctx, bx, by, bw, bh, 10); ctx.fillStyle = '#FFF4F6'; ctx.fill(); ctx.strokeStyle = '#FF4D6D'; ctx.lineWidth = 3; ctx.stroke();
          ctx.font = '900 10px system-ui,sans-serif'; const tagW = ctx.measureText('💬 ' + J.etiquetaPrompt).width + 14;
          rrect(ctx, bx + 8, by - 9, tagW, 17, 8); ctx.fillStyle = '#FF4D6D'; ctx.fill();
          label(ctx, '💬 ' + J.etiquetaPrompt, bx + 14, by - 1, 10, '#fff', 'left', 900);
          lines.forEach((ln, i) => label(ctx, ln, bx + 8, by + 18 + i * 15, 12, '#5A0018', 'left', 800));
        }
      },
      draw(ctx) {
        ctx.fillStyle = '#070B24'; ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 45; i++) { const sx = (i * 89) % w, sy = ((i * 61) % h + scroll * (1 + i % 3) * .5) % h; ctx.fillStyle = `rgba(255,255,255,${.25 + (i % 3) * .2})`; ctx.fillRect(sx, sy, 2, 2 + (i % 3)); }
        const pa = this.pa(), y0 = this.py();
        th.forEach(o => this.drawThreat(ctx, o));
        // Teus
        const sh = clamp(w * .22, 70, 104), sw = sh * .9;
        if (this.on('auto')) { ctx.strokeStyle = 'rgba(92,242,166,.5)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(x, y0 + sh * .45); ctx.lineTo(tx, y0 + sh * .45); ctx.stroke(); ctx.setLineDash([]); label(ctx, J.auto, x, y0 + sh * .62, 12, '#5CF2A6'); }
        if (!(invul > 0 && Math.floor(invul * 12) % 2)) {
          ctx.save(); if (stall > 0) { ctx.globalAlpha = .55; ctx.translate(rnd(-3, 3), 0); }
          if (TEUS_EL.complete) ctx.drawImage(TEUS_EL, x - sw / 2, y0 - sh / 2, sw, sh);
          ctx.restore();
        }
        if (stall > 0) label(ctx, '😵', x + sw * .35, y0 - sh * .45, 22);
        if (this.on('firewall')) {
          ctx.strokeStyle = '#B99CFF'; ctx.lineWidth = 4; ctx.beginPath();
          for (let i = 0; i <= 6; i++) { const a = i / 6 * 6.283 + performance.now() / 900, R = sh * .68; ctx.lineTo(x + Math.cos(a) * R, y0 + Math.sin(a) * R); } ctx.stroke();
        }
        if (this.on('antipi')) {
          ctx.strokeStyle = '#7FF7FF'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.arc(x - sw * .02, y0 - sh * .2, sh * .36, 0, 7); ctx.stroke(); ctx.setLineDash([]);
          label(ctx, '🧠', x - sw * .45, y0 - sh * .5, 18);
        }
        if (glitch > 0) for (let i = 0; i < 5; i++) { ctx.fillStyle = i % 2 ? 'rgba(255,0,170,.18)' : 'rgba(0,255,255,.15)'; ctx.fillRect(rnd(-20, 20), Math.random() * h, pa, rnd(3, 12)); }
        // panel de poderes
        ctx.fillStyle = 'rgba(11,31,77,.95)'; ctx.fillRect(w - pw - 6, 0, pw + 6, h);
        ctx.fillStyle = '#7B3FE4'; ctx.fillRect(w - pw - 6, 0, 3, h);
        label(ctx, J.titulo, w - pw / 2 - 2, 18, 13, '#FFD84D');
        const blink = Math.floor(performance.now() / 250) % 2;
        P.forEach((p, i) => {
          const r = this.cardRect(i), active = p.t > 0, ready = cool <= 0 && !active, hinted = hint[p.id] > 0 && !active;
          rrect(ctx, r.x, r.y, r.w, r.h, 12);
          ctx.fillStyle = active ? 'rgba(123,63,228,.6)' : ready ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.04)'; ctx.fill();
          ctx.lineWidth = hinted ? 4 : active ? 3 : 2; ctx.strokeStyle = hinted && blink ? '#FFD84D' : active ? '#D9C9FF' : 'rgba(255,255,255,.3)'; ctx.stroke();
          const cx = r.x + r.w / 2;
          ctx.globalAlpha = ready || active ? 1 : .5;
          label(ctx, p.icono, cx, r.y + 22, 24);
          ctx.font = '900 12.5px system-ui,sans-serif';
          const ls = wrapText(ctx, p.nombre, r.w - 12); ls.forEach((ln, j) => label(ctx, ln, cx, r.y + 46 + j * 14, 12.5, '#fff'));
          label(ctx, 'vs ' + p.contra, cx, r.y + r.h - 32, 10.5, '#C3CDE6', 'center', 800);
          ctx.globalAlpha = 1;
          if (active) {
            rrect(ctx, r.x + 8, r.y + r.h - 18, r.w - 16, 9, 4); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill();
            rrect(ctx, r.x + 8, r.y + r.h - 18, (r.w - 16) * (p.t / DUR), 9, 4); ctx.fillStyle = '#5CF2A6'; ctx.fill();
          } else label(ctx, ready ? `👆 ${J.toca}` : `⏳ ${Math.ceil(cool)}`, cx, r.y + r.h - 13, 12, ready ? '#FFD84D' : '#C3CDE6');
        });
      }
    };
    return self;
  },

  /* ---------- IBT · Biorreactor: mantén las condiciones para que las microalgas produzcan biocombustible ---------- */
  ibt() {
    let w, h, vars, prodT = 0, badT = 0, fuel = 0, cells = [], bubbles = [], wasAll = true;
    const J = CONTENT.juego.biorreactor, ZL = 45, ZH = 75;
    const self = {
      stats: { a: 0, e: 0 },
      controls: [0, 1, 2].map(i => ({ icon: J.iconos[i], label: J.botones[i], aria: 'Subir ' + J.nombres[i], action: () => self.boost(i) })),
      init(W, H) { w = W; h = H; vars = [0, 1, 2].map(() => ({ v: rnd(56, 66), rate: rnd(5, 9), chg: rnd(1.5, 3), flash: 0 })); for (let i = 0; i < 10; i++) this.addCell(); },
      resize(W, H) { w = W; h = H; },
      addCell() { if (cells.length < 70) cells.push({ x: rnd(.08, .92), y: rnd(.1, .95), r: rnd(4, 7), ph: rnd(0, 6) }); },
      boost(i) { const v = vars[i]; v.v = Math.min(100, v.v + 16); v.flash = .25; Snd.tap(); },
      key(k) { if (k === '1' || k === '2' || k === '3') this.boost(+k - 1); else return false; },
      ok(v) { return v.v >= ZL && v.v <= ZH; },
      update(dt, t) {
        vars.forEach(v => { v.chg -= dt; if (v.chg <= 0) { v.chg = rnd(1.5, 3); v.rate = rnd(4.5, 8.5) + t * .15; } v.v = Math.max(0, v.v - v.rate * dt); v.flash = Math.max(0, v.flash - dt); });
        const all = vars.every(v => this.ok(v));
        if (wasAll && !all) Snd.tone(300, .15, 'triangle', .07, 200);
        wasAll = all;
        prodT += dt; if (prodT >= .5) { prodT = 0; if (all) { this.stats.a++; fuel++; this.addCell(); Snd.tick(); bubbles.push({ x: rnd(.2, .8), y: 1, s: rnd(.25, .45) }); } }
        badT += dt; if (badT >= 1) { badT = 0; if (!all) this.stats.e++; }
        bubbles.forEach(b => b.y -= b.s * dt); bubbles = bubbles.filter(b => b.y > 0);
        this.all = all;
      },
      draw(ctx) {
        const g = ctx.createRadialGradient(w / 2, h * .3, 10, w / 2, h * .3, h); g.addColorStop(0, '#0F4A35'); g.addColorStop(1, '#05201A');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        const gaugeH = 3 * 38 + 12, top = 14, bottom = h - gaugeH - 8;
        const rw = w * .62, rx = 14, rh = bottom - top - 30;
        // biorreactor
        rrect(ctx, rx, top + 26, rw, rh, 26); ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fill(); ctx.strokeStyle = '#C6F5DD'; ctx.lineWidth = 3; ctx.stroke();
        ctx.save(); rrect(ctx, rx + 6, top + 32, rw - 12, rh - 12, 22); ctx.clip();
        const lg = ctx.createLinearGradient(0, top, 0, bottom); lg.addColorStop(0, this.all ? '#1F8F55' : '#4E5A52'); lg.addColorStop(1, this.all ? '#0E5A34' : '#2E3632');
        ctx.fillStyle = lg; ctx.fillRect(rx, top + 40, rw, rh);
        const tt = performance.now() / 1000;
        cells.forEach(c => {
          const x = rx + 10 + c.x * (rw - 20) + Math.sin(tt + c.ph) * 3, y = top + 44 + c.y * (rh - 30) + Math.cos(tt * .8 + c.ph) * 3;
          ctx.beginPath(); ctx.arc(x, y, c.r, 0, 7); ctx.fillStyle = this.all ? '#7DF29E' : '#8E9A92'; ctx.fill();
          ctx.beginPath(); ctx.arc(x - c.r * .25, y - c.r * .2, c.r * .35, 0, 7); ctx.fillStyle = this.all ? '#1B6B3A' : '#5A645E'; ctx.fill();
        });
        bubbles.forEach(b => { ctx.beginPath(); ctx.arc(rx + b.x * rw, top + 40 + b.y * rh, 4, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke(); });
        ctx.restore();
        label(ctx, this.all ? J.produciendo : J.fuera, rx + rw / 2, top + 10, 13, this.all ? '#7DF29E' : '#FFB3B3', 'center', 900);
        // tanque de biocombustible
        const tx = rx + rw + 16, tw = w - tx - 14, th = rh, ty = top + 26, lvl = clamp(fuel / 90, 0, 1);
        rrect(ctx, tx, ty, tw, th, 12); ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fill(); ctx.strokeStyle = '#FFD84D'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#E8B800'; rrect(ctx, tx + 4, ty + th - 4 - (th - 8) * lvl, tw - 8, (th - 8) * lvl, 8); ctx.fill();
        label(ctx, '🛢️', tx + tw / 2, ty - 12, 16);
        label(ctx, `${fuel * 5} ${J.litros}`, tx + tw / 2, ty + th - 16, 14, '#fff');
        // indicadores
        vars.forEach((v, i) => {
          const y = bottom + 6 + i * 38, bx = 134, bw = w - bx - 74, ok = this.ok(v);
          label(ctx, `${J.iconos[i]} ${J.nombres[i]}`, 14, y + 14, 13, '#E6ECFA', 'left', 800);
          rrect(ctx, bx, y + 6, bw, 16, 8); ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill();
          ctx.fillStyle = 'rgba(92,242,166,.35)'; ctx.fillRect(bx + bw * ZL / 100, y + 6, bw * (ZH - ZL) / 100, 16);
          ctx.fillStyle = v.flash ? '#fff' : ok ? '#5CF2A6' : '#FF6B6B';
          rrect(ctx, bx + bw * v.v / 100 - 5, y + 2, 10, 24, 4); ctx.fill();
          const st = ok ? '✓ ' + J.ok : v.v < ZL ? '▼ ' + J.baja : '▲ ' + J.alta;
          label(ctx, st, w - 14, y + 14, 12, ok ? '#5CF2A6' : '#FF6B6B', 'right', 900);
        });
      }
    };
    return self;
  },

  /* ---------- IC · Puente: apila las vigas con precisión ---------- */
  ic() {
    let w, h, sh, stack, cur, falling, cam = 0, baseW;
    const J = CONTENT.juego.puente, col = C.ic.color;
    const self = {
      stats: { a: 0, e: 0 },
      init(W, H) { w = W; h = H; sh = clamp(h * .055, 20, 34); baseW = w * .56; stack = [{ x: (w - baseW) / 2, w: baseW }]; falling = []; this.spawn(); },
      resize(W, H) { const f = W / w; stack.forEach(s => { s.x *= f; s.w *= f; }); if (cur) { cur.x *= f; cur.w *= f; } baseW *= f; w = W; h = H; sh = clamp(h * .055, 20, 34); },
      spawn(width) {
        const top = stack[stack.length - 1], cw = width || top.w, dir = stack.length % 2 ? 1 : -1;
        cur = { x: dir > 0 ? 0 : w - cw, w: cw, dir };
      },
      levelY(i) { return h - 30 - (i + 1) * sh + cam; },
      drop() {
        if (!cur) return;
        const top = stack[stack.length - 1], L = Math.max(cur.x, top.x), Rr = Math.min(cur.x + cur.w, top.x + top.w), ov = Rr - L;
        const y = this.levelY(stack.length);
        if (ov <= 0) {
          this.stats.e++; hurt(8); falling.push({ x: cur.x, y, w: cur.w, vy: 0, rot: 0, vr: cur.dir * 2 });
          this.fx.text(w / 2, y - 30, J.fallo, '#FF6B6B'); this.spawn(top.w); return;
        }
        if (Math.abs(cur.x - top.x) < 7) {
          stack.push({ x: top.x, w: top.w }); this.stats.a += 2; Snd.good(); buzz(20);
          this.fx.text(w / 2, y - 30, J.perfecto, '#FFD84D', 26); this.fx.burst(top.x + top.w / 2, y, '#FFD84D', 18);
        } else {
          stack.push({ x: L, w: ov }); this.stats.a++; Snd.tick();
          const cutX = cur.x < top.x ? cur.x : Rr, cutW = cur.w - ov;
          falling.push({ x: cutX, y, w: cutW, vy: 0, rot: 0, vr: cur.x < top.x ? -2 : 2 });
        }
        const placed = stack[stack.length - 1];
        if (placed.w < w * .12) { this.fx.text(w / 2, y - 60, J.refuerzo, '#5CF2A6', 20); this.spawn(baseW * .7); }
        else this.spawn();
      },
      down() { this.drop(); },
      key(k) { if (k === ' ' || k === 'Enter' || k === 'ArrowDown') this.drop(); else return false; },
      update(dt, t) {
        const target = Math.max(0, (stack.length - 7) * sh);
        cam += (target - cam) * Math.min(1, dt * 6);
        if (cur) {
          const v = w * Math.min(1.25, .5 + stack.length * .025);
          cur.x += cur.dir * v * dt;
          if (cur.x <= 0) { cur.x = 0; cur.dir = 1; } if (cur.x + cur.w >= w) { cur.x = w - cur.w; cur.dir = -1; }
        }
        falling.forEach(f => { f.vy += 1400 * dt; f.y += f.vy * dt; f.rot += f.vr * dt; });
        falling = falling.filter(f => f.y < h + 200);
      },
      beam(ctx, x, y, bw, alpha = 1) {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = col; ctx.fillRect(x, y, bw, sh);
        ctx.fillStyle = '#F2B544'; ctx.fillRect(x, y, bw, sh * .22);
        ctx.fillStyle = '#7A4A00'; ctx.fillRect(x, y + sh * .78, bw, sh * .22);
        ctx.fillStyle = '#5A3600'; for (let rx = x + 8; rx < x + bw - 4; rx += 18) { ctx.beginPath(); ctx.arc(rx, y + sh * .5, 2.6, 0, 7); ctx.fill(); }
        ctx.strokeStyle = '#3A2200'; ctx.lineWidth = 2; ctx.strokeRect(x, y, bw, sh);
        ctx.globalAlpha = 1;
      },
      draw(ctx) {
        const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#2B1A4A'); g.addColorStop(.6, '#7A3B2A'); g.addColorStop(1, '#C27C0E');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(0,0,0,.3)'; for (let i = 0; i < 7; i++) { const bx = (i * 97) % w, bh = 60 + (i * 37) % 90; ctx.fillRect(bx, h - 30 - bh + cam * .3, 40, bh); }
        ctx.fillStyle = '#3B2A1A'; ctx.fillRect(0, h - 30 + cam, w, 30 + 400);
        ctx.strokeStyle = 'rgba(255,255,255,.15)'; for (let x = -20; x < w; x += 16) { ctx.beginPath(); ctx.moveTo(x, h + cam); ctx.lineTo(x + 20, h - 30 + cam); ctx.stroke(); }
        stack.forEach((s, i) => { const y = this.levelY(i); if (y < h + sh) this.beam(ctx, s.x, y, s.w); });
        if (cur) {
          const y = this.levelY(stack.length);
          ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
          const top = stack[stack.length - 1]; ctx.strokeRect(top.x, y, top.w, sh); ctx.setLineDash([]);
          this.beam(ctx, cur.x, y, cur.w);
        }
        falling.forEach(f => { ctx.save(); ctx.translate(f.x + f.w / 2, f.y + sh / 2); ctx.rotate(f.rot); this.beam(ctx, -f.w / 2, -sh / 2, f.w, .8); ctx.restore(); });
        label(ctx, `🏗 ${stack.length - 1}`, 14, 18, 18, '#fff', 'left');
      }
    };
    return self;
  },

  /* ---------- IIS · Filas: mueve a tu equipo para que nada se sature ---------- */
  iis() {
    let w, h, lanes, team = 1, teamX = null, surgeT = 2, served = 0;
    const J = CONTENT.juego.filas, CAP = 10;
    const self = {
      stats: { a: 0, e: 0 },
      init(W, H) {
        w = W; h = H;
        lanes = [0, 1, 2].map(i => ({ q: rnd(2, 4), rate: rnd(.6, .9), surge: 0, flash: 0, served: 0 }));
      },
      resize(W, H) { w = W; h = H; },
      laneX(i) { return w * (i + .5) / 3; },
      pick(i) { if (i < 0 || i > 2) return; if (i !== team) { team = i; Snd.tap(); } },
      down(x) { this.pick(Math.floor(x / (w / 3))); },
      key(k) {
        if (k === '1' || k === '2' || k === '3') this.pick(+k - 1);
        else if (k === 'ArrowLeft') this.pick(Math.max(0, team - 1));
        else if (k === 'ArrowRight') this.pick(Math.min(2, team + 1));
        else return false;
      },
      update(dt, t) {
        if (teamX === null) teamX = this.laneX(team);
        teamX += (this.laneX(team) - teamX) * Math.min(1, dt * 12);
        surgeT -= dt;
        if (surgeT <= 0) { surgeT = rnd(2.6, 3.6) - Math.min(1, t * .03); const l = lanes[Math.floor(rnd(0, 3))]; l.surge = 2.6; }
        lanes.forEach((l, i) => {
          l.flash = Math.max(0, l.flash - dt * 2);
          const extra = l.surge > 0 ? 1.9 + t * .02 : 0; l.surge = Math.max(0, l.surge - dt);
          l.q += (l.rate + t * .018 + extra) * dt;
          if (i === team && Math.abs(teamX - this.laneX(i)) < 20) {
            const before = Math.floor(l.q); l.q = Math.max(0, l.q - 4.2 * dt);
            if (Math.floor(l.q) < before) { served++; if (served % 2 === 0) { this.stats.a++; Snd.tick(); } this.fx.burst(this.laneX(i), this.baseY() - 20, '#5CF2A6', 4); }
          }
          if (l.q >= CAP) { l.q = 6; l.flash = 1; this.stats.e++; hurt(8); this.fx.text(this.laneX(i), this.topY() - 4, J.saturada, '#FF6B6B', 20); }
        });
      },
      baseY() { return h - 70; }, topY() { return 46; },
      draw(ctx) {
        ctx.fillStyle = '#062A30'; ctx.fillRect(0, 0, w, h);
        const lw = w / 3, base = this.baseY(), top = this.topY(), step = (base - top - 10) / CAP;
        ctx.setLineDash([8, 6]); ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(w, top); ctx.stroke(); ctx.setLineDash([]);
        label(ctx, J.limite, w - 8, top - 12, 12, '#FFB3B3', 'right', 800);
        lanes.forEach((l, i) => {
          const x0 = i * lw, cx = this.laneX(i), active = i === team;
          rrect(ctx, x0 + 6, top, lw - 12, base - top, 12);
          ctx.fillStyle = l.flash ? `rgba(255,77,109,${.25 + l.flash * .4})` : active ? 'rgba(63,208,219,.18)' : 'rgba(255,255,255,.05)'; ctx.fill();
          ctx.lineWidth = active ? 4 : 2; ctx.strokeStyle = active ? '#3FD0DB' : 'rgba(255,255,255,.18)'; ctx.stroke();
          const n = Math.floor(l.q);
          for (let p = 0; p < n; p++) {
            const py = base - 16 - p * step, px = cx + (p % 2 ? 7 : -7);
            const bs = Math.min(22, step * .78);
            rrect(ctx, px - bs / 2, py - bs * .6, bs, bs * .8, 3); ctx.fillStyle = p >= 7 ? '#FFB3B3' : '#E8C48A'; ctx.fill();
            ctx.strokeStyle = '#5A3A10'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px, py - bs * .6); ctx.lineTo(px, py + bs * .2); ctx.stroke();
          }
          label(ctx, `${n}/${CAP}`, cx, top + 16, 15, n >= 7 ? '#FFB3B3' : '#fff');
          if (l.surge > 0 && Math.floor(l.surge * 4) % 2 === 0) label(ctx, '⚠ +', cx, top + 38, 18, '#FFD84D');
          label(ctx, J.iconos[i], cx, base + 20, 22);
          label(ctx, J.nombres[i], cx, base + 46, 14, '#DDF8FA', 'center', 800);
        });
        if (teamX !== null) {
          const y = base - 4;
          rrect(ctx, teamX - 36, y - 2, 72, 22, 11); ctx.fillStyle = '#FFD84D'; ctx.fill();
          label(ctx, '▲ ' + J.equipo, teamX, y + 9, 12, '#111');
        }
      }
    };
    return self;
  }
};

/* ---------- Arranque ---------- */
screenHome();
